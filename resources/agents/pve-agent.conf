# pve-agent.conf — configuration for the iPXE-PveController provisioning agent
#
# The agent loads this file AUTOMATICALLY (no need to export anything), searching
# in this order and using the first one found:
#     1. the --conf PATH argument (or the PVE_CONF environment variable)
#     2. /etc/pve-agent.conf
#     3. pve-agent.conf / agent.conf / pve.conf next to the script
#     4. the same names in the current working directory
# So dropping it next to the script (or in /etc) is enough to run
# `python3 agent.py` manually.
#
# It is also usable as a systemd EnvironmentFile; the shipped unit references
# /etc/pve-agent.conf:
#     /etc/systemd/system/pve-agent.service -> EnvironmentFile=-/etc/pve-agent.conf
#
# Format: KEY=value, one per line. Lines starting with '#' are comments.
# (Values are read verbatim; surrounding quotes are optional.)
#
# Precedence (highest first):
#   1. command-line arguments  (--ctrl, --token, ...)
#   2. real environment        (export PVE_CTRL=...)
#   3. this file
#   4. the kernel command line (pve_ctrl=, pve_api_token=, pve_iface=)
#
# => If the boot script already passes the URL (Boot tab option "Pass the
#    controller URL to the kernel cmdline"), you can leave this file as-is.
#    Set PVE_CTRL here to hard-code it in the image instead.

# --- Controller (required unless passed on the kernel cmdline) -------------
# Base URL of the controller, reachable from the node. No trailing slash.
PVE_CTRL=http://192.168.1.71:8000

# --- Optional --------------------------------------------------------------

# Shared API token, if you set one under Settings -> api.token.
# PVE_API_TOKEN=

# Force a specific NIC instead of auto-detecting the one that reaches the
# controller (default: auto).
# PVE_IFACE=enp2s0

# Force a MAC address instead of reading it from the chosen NIC.
# PVE_MAC=aa:bb:cc:dd:ee:ff

# Target root. Point this at a mount point when running from an installer
# (e.g. /mnt or /target) so files are written into the new system.
# Default: /
# PVE_ROOT=/

# Only report the hardware, do not apply any configuration (true/false).
# PVE_REPORT_ONLY=false

# Keep polling until the node is accepted, then keep it applied (true/false).
# The shipped systemd unit already passes --watch, so usually not needed here.
# PVE_WATCH=false

# Poll interval in seconds for --watch.
# PVE_INTERVAL=5

# Simulate: print what would change, write nothing (true/false).
# PVE_DRY_RUN=false

# HTTP timeout for the report request, in seconds.
# PVE_TIMEOUT=20
