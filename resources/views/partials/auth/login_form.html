<div id="login-card" class="w-full max-w-sm">
    <div class="mb-8 text-center">
        <span class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-brand-600/20 text-xl text-brand-300">
            <i class="fa-solid fa-network-wired"></i>
        </span>
        <h1 class="text-xl font-semibold tracking-tight">{{ app_name }}</h1>
        <p class="mt-1 text-sm text-slate-500">Sign in to manage your Proxmox nodes</p>
    </div>

    <form hx-post="{{ url_for('login') }}"
          hx-target="#login-card"
          hx-swap="outerHTML"
          method="post"
          action="{{ url_for('login') }}"
          class="space-y-4 rounded-2xl border border-slate-800 bg-slate-900/60 p-6 shadow-xl">
        <input type="hidden" name="_token" value="{{ csrf_token() }}">

        {% if error %}
        <div class="flex items-start gap-2 rounded-lg border border-rose-500/30 bg-rose-500/10 px-3 py-2 text-sm text-rose-200">
            <i class="fa-solid fa-circle-exclamation mt-0.5"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <div>
            <label for="username" class="mb-1 block text-sm text-slate-400">Username</label>
            <div class="relative">
                <i class="fa-solid fa-user pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
                <input id="username" name="username" value="{{ username or '' }}" required
                       autocomplete="username" autofocus
                       class="w-full rounded-lg border border-slate-800 bg-slate-950 py-2 pl-10 pr-3 text-sm text-slate-100 outline-none transition focus:border-brand-500">
            </div>
        </div>

        <div>
            <label for="password" class="mb-1 block text-sm text-slate-400">Password</label>
            <div class="relative">
                <i class="fa-solid fa-lock pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
                <input id="password" name="password" type="password" required
                       autocomplete="current-password"
                       class="w-full rounded-lg border border-slate-800 bg-slate-950 py-2 pl-10 pr-3 text-sm text-slate-100 outline-none transition focus:border-brand-500">
            </div>
        </div>

        <button type="submit"
                class="flex w-full items-center justify-center gap-2 rounded-lg bg-brand-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-brand-500">
            <i class="fa-solid fa-right-to-bracket"></i>
            <span>Sign in</span>
        </button>
    </form>
</div>
