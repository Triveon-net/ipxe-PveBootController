{% set user = auth_user() %}
<header class="flex h-16 shrink-0 items-center justify-between border-b border-slate-800 bg-slate-900/60 px-6 backdrop-blur">
    <div class="flex items-center gap-3 md:hidden">
        <i class="fa-solid fa-network-wired text-brand-400"></i>
        <span class="font-semibold">{{ app_name }}</span>
    </div>
    <div class="hidden text-sm text-slate-500 md:block">
        Proxmox PXE provisioning &amp; auto-configuration
    </div>

    <div class="flex items-center gap-4">
        <a href="{{ url_for('boot.ipxe') }}" target="_blank"
           class="hidden items-center gap-2 text-xs text-slate-400 hover:text-slate-200 sm:flex">
            <i class="fa-solid fa-file-code"></i> boot.ipxe
        </a>

        {% if user %}
        <div class="flex items-center gap-3">
            <div class="text-right">
                <div class="text-sm font-medium text-slate-200">{{ user.full_name }}</div>
                <div class="text-xs text-slate-500">@{{ user.username }}</div>
            </div>
            <span class="flex h-9 w-9 items-center justify-center rounded-full bg-brand-600/20 text-sm font-semibold text-brand-300">
                {{ user.initials }}
            </span>
            <button type="button"
                    hx-post="{{ url_for('logout') }}"
                    hx-swap="none"
                    class="rounded-lg border border-slate-800 px-3 py-1.5 text-xs text-slate-400 transition hover:border-slate-700 hover:text-slate-100">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span class="ml-1">Sign out</span>
            </button>
        </div>
        {% endif %}
    </div>
</header>
