{% extends layout %}
{% block title %}Edit {{ node.name }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-4xl">
    <div class="mb-6">
        <a href="{{ url_for('nodes.index') }}"
           hx-get="{{ url_for('nodes.index') }}" hx-target="#app-content" hx-push-url="true"
           class="text-xs text-slate-500 hover:text-slate-300"><i class="fa-solid fa-arrow-left mr-1"></i>Nodes</a>
        <h1 id="page-title" class="mt-2 text-2xl font-semibold tracking-tight text-slate-100">Edit {{ node.name }}</h1>
        <p class="mt-1 text-sm text-slate-500">{{ node.mac_address }}</p>
    </div>

    <div id="node-form-panel">
        {% include 'partials/nodes/form.html' %}
    </div>
</div>
{% endblock %}
