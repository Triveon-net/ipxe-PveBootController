{% extends layout %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="mx-auto max-w-3xl">
    <div class="mb-6">
        <h1 id="page-title" class="text-2xl font-semibold tracking-tight text-slate-100">Settings</h1>
        <p class="mt-1 text-sm text-slate-500">Global PXE boot and API configuration.</p>
    </div>

    <form hx-post="{{ url_for('settings.update') }}" hx-swap="none"
          method="post" action="{{ url_for('settings.update') }}"
          class="space-y-6 rounded-xl border border-slate-800 bg-slate-900/50 p-6">
        <input type="hidden" name="_token" value="{{ csrf_token() }}">

        <section class="space-y-4">
            <h2 class="text-sm font-medium text-slate-300"><i class="fa-solid fa-network-wired mr-2 text-brand-400"></i>PXE / Netboot</h2>
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                <div>
                    <label class="mb-1 block text-sm text-slate-400" for="nextserver">Next server (DHCP option 66)</label>
                    <input id="nextserver" name="pxe.next_server" value="{{ settings['pxe.next_server'] }}"
                           placeholder="10.0.0.5"
                           class="w-full rounded-lg border border-slate-800 bg-slate-950 px-3 py-2 font-mono text-sm text-slate-100 outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="mb-1 block text-sm text-slate-400" for="bootfile">Boot filename (option 67)</label>
                    <input id="bootfile" name="pxe.boot_file" value="{{ settings['pxe.boot_file'] }}"
                           placeholder="boot.ipxe"
                           class="w-full rounded-lg border border-slate-800 bg-slate-950 px-3 py-2 font-mono text-sm text-slate-100 outline-none focus:border-brand-500">
                </div>
            </div>
        </section>

        <section class="space-y-4 border-t border-slate-800 pt-6">
            <h2 class="text-sm font-medium text-slate-300"><i class="fa-solid fa-circle-nodes mr-2 text-brand-400"></i>Cluster defaults</h2>
            <div>
                <label class="mb-1 block text-sm text-slate-400" for="quorum">Default expected quorum votes</label>
                <input id="quorum" name="cluster.default_quorum" type="number" min="1"
                       value="{{ settings['cluster.default_quorum'] }}"
                       class="w-full max-w-[12rem] rounded-lg border border-slate-800 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none focus:border-brand-500">
            </div>
        </section>

        <section class="space-y-4 border-t border-slate-800 pt-6">
            <h2 class="text-sm font-medium text-slate-300"><i class="fa-solid fa-key mr-2 text-brand-400"></i>API access</h2>
            <div>
                <label class="mb-1 block text-sm text-slate-400" for="apitoken">Shared API token</label>
                <input id="apitoken" name="api.token" value="{{ settings['api.token'] }}"
                       placeholder="leave empty to disable token auth"
                       class="w-full rounded-lg border border-slate-800 bg-slate-950 px-3 py-2 font-mono text-sm text-slate-100 outline-none focus:border-brand-500">
                <p class="mt-1 text-xs text-slate-500">
                    When set, machine clients must send it in the <code class="font-mono">X-API-Token</code> header.
                </p>
            </div>
        </section>

        <div class="flex justify-end border-t border-slate-800 pt-6">
            <button type="submit"
                    class="inline-flex items-center gap-2 rounded-lg bg-brand-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-brand-500">
                <i class="fa-solid fa-floppy-disk"></i><span>Save settings</span>
            </button>
        </div>
    </form>
</div>
{% endblock %}
