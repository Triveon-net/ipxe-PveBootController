<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ app_name }}{% endblock %} · {{ app_name }}</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff', 100: '#e0e7ff', 300: '#a5b4fc',
                            400: '#818cf8', 500: '#6366f1', 600: '#4f46e5',
                            700: '#4338ca',
                        },
                    },
                },
            },
        };
    </script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="{{ asset('css/app.css') }}">
</head>
<body class="h-full bg-slate-950 text-slate-200 antialiased"
      hx-headers='{"X-CSRF-Token": "{{ csrf_token() }}"}'>
{% include 'partials/flash.html' %}

<div class="flex min-h-full">
    {% include 'partials/sidebar.html' %}

    <div class="flex min-w-0 flex-1 flex-col">
        {% include 'partials/topbar.html' %}

        <main id="app-content" class="flex-1 overflow-y-auto p-6">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>

<div id="htmx-indicator"
     class="htmx-indicator pointer-events-none fixed inset-x-0 top-0 z-50 h-0.5 bg-brand-500">
</div>

<script src="{{ asset('js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
