<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ status }} · {{ app_name }}</title>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-slate-950 text-slate-200 antialiased">
<div class="flex min-h-full flex-col items-center justify-center px-4 text-center">
    <div class="mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-rose-500/10 text-2xl text-rose-300">
        <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h1 class="text-4xl font-semibold tracking-tight text-slate-100">{{ status }}</h1>
    <p class="mt-2 max-w-md text-sm text-slate-400">{{ message }}</p>
    <a href="/dashboard"
       class="mt-6 inline-flex items-center gap-2 rounded-lg border border-slate-800 px-4 py-2 text-sm text-slate-300 transition hover:border-slate-700 hover:text-white">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Back to dashboard</span>
    </a>
</div>
</body>
</html>
